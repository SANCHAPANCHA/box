<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Аквариум</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050b14; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; color: #cfe8ff; font-size: 13px;
    background: rgba(5, 20, 40, 0.55); padding: 10px 14px; border-radius: 10px;
    pointer-events: none; line-height: 1.5; backdrop-filter: blur(4px);
  }
  #hud b { color: #fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <b>3D Аквариум</b><br />
  Мышь — вращать, колесо — приблизить<br />
  Клик по воде — покормить рыбок
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Tank inner dimensions (centered at origin, floor at y = -H/2)
const W = 12, H = 7, D = 6;
const HALF = new THREE.Vector3(W / 2, H / 2, D / 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1626);
scene.fog = new THREE.Fog(0x0a1626, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -0.5, 0);
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.62;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x9fd6ff, 0x1a2a20, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(3, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
scene.add(sun);
const tankLight = new THREE.PointLight(0x4fc3ff, 25, 14);
tankLight.position.set(0, H / 2 - 0.3, 0);
scene.add(tankLight);

// ---------- Room: table ----------
const table = new THREE.Mesh(
  new THREE.BoxGeometry(W + 6, 0.6, D + 4),
  new THREE.MeshStandardMaterial({ color: 0x3b2614, roughness: 0.7 })
);
table.position.y = -H / 2 - 0.55;
table.receiveShadow = true;
scene.add(table);

// ---------- Tank frame + glass ----------
const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.6 });
const base = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.3, D + 0.4), frameMat);
base.position.y = -H / 2 - 0.1;
base.castShadow = base.receiveShadow = true;
scene.add(base);
const rim = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.2, D + 0.4), frameMat);
rim.position.y = H / 2 + 0.3;
scene.add(rim);
// Edges: vertical posts at corners
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, H + 0.6, 0.12), frameMat);
  post.position.set(sx * (W / 2 + 0.1), 0.15, sz * (D / 2 + 0.1));
  scene.add(post);
}
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(W + 0.2, H + 0.6, D + 0.2),
  new THREE.MeshPhysicalMaterial({
    color: 0xcfefff, transparent: true, opacity: 0.12, roughness: 0.05,
    metalness: 0, side: THREE.DoubleSide, depthWrite: false
  })
);
glass.position.y = 0.15;
glass.renderOrder = 10;
scene.add(glass);

// Water volume (slightly tinted)
const water = new THREE.Mesh(
  new THREE.BoxGeometry(W, H, D),
  new THREE.MeshPhysicalMaterial({
    color: 0x1e88c8, transparent: true, opacity: 0.16, roughness: 0.1,
    side: THREE.BackSide, depthWrite: false
  })
);
water.renderOrder = 5;
scene.add(water);

// Animated water surface
const surfGeo = new THREE.PlaneGeometry(W, D, 60, 30);
surfGeo.rotateX(-Math.PI / 2);
const surface = new THREE.Mesh(surfGeo, new THREE.MeshPhysicalMaterial({
  color: 0x7fd4ff, transparent: true, opacity: 0.45, roughness: 0.05,
  side: THREE.DoubleSide, depthWrite: false
}));
surface.position.y = H / 2;
surface.renderOrder = 6;
scene.add(surface);
const surfBase = surfGeo.attributes.position.array.slice();

// ---------- Sand floor with dunes ----------
const sandGeo = new THREE.PlaneGeometry(W, D, 80, 40);
sandGeo.rotateX(-Math.PI / 2);
{
  const p = sandGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const backRise = 0.15 + (-z / D + 0.5) * 0.6; // sand slopes up toward the back
    p.setY(i, backRise + Math.sin(x * 0.9) * 0.08 + Math.cos(z * 1.7 + x * 0.4) * 0.06 + Math.random() * 0.03);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd9c08a, roughness: 1 }));
sand.position.y = -H / 2;
sand.receiveShadow = true;
scene.add(sand);
const floorY = (x, z) => -H / 2 + 0.15 + (-z / D + 0.5) * 0.6;

// ---------- Rocks ----------
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b6f75, roughness: 0.9, flatShading: true });
function addRock(x, z, s) {
  const g = new THREE.DodecahedronGeometry(s, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const k = 0.75 + Math.random() * 0.4;
    p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * 0.7, p.getZ(i) * k);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, rockMat);
  m.position.set(x, floorY(x, z) + s * 0.3, z);
  m.rotation.y = Math.random() * Math.PI;
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
}
addRock(-4, -1.8, 1.1); addRock(-3, -2.2, 0.7); addRock(3.8, -1.5, 0.9);
addRock(4.6, 1.5, 0.5); addRock(-1.2, 1.8, 0.4); addRock(1.5, -2.3, 0.6);

// ---------- Seaweed (vertex-animated) ----------
const weeds = [];
function addWeed(x, z, height, color) {
  const g = new THREE.PlaneGeometry(0.25, height, 1, 16);
  g.translate(0, height / 2, 0);
  const mat = new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.8 });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = { value: 0 };
    shader.uniforms.uPhase = { value: Math.random() * 10 };
    mat.userData.shader = shader;
    shader.vertexShader = 'uniform float uTime; uniform float uPhase;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       float k = position.y / ${height.toFixed(2)};
       transformed.x += sin(uTime * 1.3 + uPhase + position.y * 1.2) * 0.35 * k * k;
       transformed.z += cos(uTime * 0.9 + uPhase) * 0.15 * k * k;
       transformed.x *= 1.0 - k * 0.6;`
    );
  };
  const m = new THREE.Mesh(g, mat);
  m.position.set(x, floorY(x, z), z);
  m.rotation.y = Math.random() * Math.PI;
  m.castShadow = true;
  scene.add(m);
  weeds.push(mat);
}
const weedColors = [0x2e8b57, 0x3cb371, 0x228b22, 0x6b8e23];
for (let i = 0; i < 45; i++) {
  const cluster = [[-4.8, -2], [-2.4, -2.4], [4.5, -2.2], [2.6, -2.5], [0, -2.6], [5, 0.5]][i % 6];
  const x = cluster[0] + (Math.random() - 0.5) * 1.2;
  const z = cluster[1] + (Math.random() - 0.5) * 0.8;
  addWeed(x, z, 2 + Math.random() * 3, weedColors[i % weedColors.length]);
}

// ---------- Bubbles ----------
const BUBBLES = 120;
const bubbleGeo = new THREE.SphereGeometry(1, 10, 8);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0, metalness: 0.1
});
const bubbles = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLES);
const bubbleData = [];
const emitters = [new THREE.Vector3(-5.2, 0, 2.2), new THREE.Vector3(5.3, 0, -2.4)];
for (let i = 0; i < BUBBLES; i++) {
  const e = emitters[i % emitters.length];
  bubbleData.push({
    pos: new THREE.Vector3(e.x, -H / 2 + Math.random() * H, e.z),
    emitter: e,
    speed: 0.8 + Math.random() * 1.2,
    size: 0.03 + Math.random() * 0.07,
    phase: Math.random() * 10
  });
}
scene.add(bubbles);
// Air stones
for (const e of emitters) {
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.15, 16),
    new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 1 }));
  stone.position.set(e.x, floorY(e.x, e.z) + 0.07, e.z);
  scene.add(stone);
}

// ---------- Fish ----------
function makeFishTexture(c1, c2, striped) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  g.fillStyle = grad; g.fillRect(0, 0, 256, 128);
  if (striped) {
    g.fillStyle = 'rgba(255,255,255,0.9)';
    for (const x of [60, 130, 190]) { g.fillRect(x, 0, 18, 128); }
    g.fillStyle = 'rgba(0,0,0,0.6)';
    for (const x of [58, 128, 188]) { g.fillRect(x, 0, 3, 128); g.fillRect(x + 18, 0, 3, 128); }
  } else {
    g.fillStyle = 'rgba(255,255,255,0.15)';
    for (let i = 0; i < 80; i++) { g.beginPath(); g.arc(Math.random() * 256, Math.random() * 128, 4, 0, 7); g.fill(); }
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const species = [
  { name: 'clown', c1: '#ff7a1a', c2: '#ff9a3c', fin: 0xff7a1a, striped: true, scale: 0.55, count: 6 },
  { name: 'blue', c1: '#1e5bff', c2: '#ffd400', fin: 0xffd400, striped: false, scale: 0.65, count: 4 },
  { name: 'neon', c1: '#00e5ff', c2: '#ff2050', fin: 0x00e5ff, striped: false, scale: 0.3, count: 14 },
  { name: 'gold', c1: '#ffcc33', c2: '#ff8800', fin: 0xffaa22, striped: false, scale: 0.75, count: 3 },
  { name: 'purple', c1: '#9b30ff', c2: '#ffb3ff', fin: 0xd070ff, striped: false, scale: 0.5, count: 5 }
];

function createFish(sp) {
  const fish = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ map: makeFishTexture(sp.c1, sp.c2, sp.striped), roughness: 0.4 });
  const finMat = new THREE.MeshStandardMaterial({ color: sp.fin, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });

  // Body: stretched sphere pointing along +X
  const bodyGeo = new THREE.SphereGeometry(1, 24, 16);
  bodyGeo.scale(1.3, 0.75, 0.42);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  fish.add(body);

  // Eyes
  const eyeW = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  const eyeB = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.1 });
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 8), eyeW);
    e.position.set(0.85, 0.15, s * 0.3);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), eyeB);
    p.position.set(0.93, 0.15, s * 0.39);
    fish.add(e, p);
  }

  // Tail (pivot at body rear so it can wag)
  const tailShape = new THREE.Shape();
  tailShape.moveTo(0, 0);
  tailShape.quadraticCurveTo(-0.6, 0.5, -1.0, 0.8);
  tailShape.quadraticCurveTo(-0.8, 0, -1.0, -0.8);
  tailShape.quadraticCurveTo(-0.6, -0.5, 0, 0);
  const tailPivot = new THREE.Group();
  tailPivot.position.x = -1.15;
  tailPivot.add(new THREE.Mesh(new THREE.ShapeGeometry(tailShape), finMat));
  fish.add(tailPivot);

  // Dorsal and side fins
  const dorsal = new THREE.Shape();
  dorsal.moveTo(0.4, 0); dorsal.quadraticCurveTo(0, 0.7, -0.6, 0.5); dorsal.lineTo(-0.5, 0); dorsal.lineTo(0.4, 0);
  const dorsalMesh = new THREE.Mesh(new THREE.ShapeGeometry(dorsal), finMat);
  dorsalMesh.position.y = 0.65;
  fish.add(dorsalMesh);
  const sideFins = [];
  for (const s of [-1, 1]) {
    const f = new THREE.Mesh(new THREE.CircleGeometry(0.28, 12, 0, Math.PI), finMat);
    f.position.set(0.2, -0.2, s * 0.38);
    f.rotation.set(Math.PI / 2, 0, Math.PI);
    fish.add(f);
    sideFins.push(f);
  }

  fish.scale.setScalar(sp.scale);
  scene.add(fish);

  const margin = sp.scale * 1.6;
  return {
    mesh: fish, tail: tailPivot, sideFins, species: sp,
    margin,
    pos: new THREE.Vector3(
      (Math.random() - 0.5) * (W - 2 * margin),
      (Math.random() - 0.3) * (H - 2 * margin) * 0.7,
      (Math.random() - 0.5) * (D - 2 * margin)
    ),
    vel: new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.2, Math.random() - 0.5).setLength(1),
    wander: Math.random() * 100,
    baseSpeed: (sp.name === 'neon' ? 1.6 : 1.0) * (0.8 + Math.random() * 0.4),
    phase: Math.random() * 10
  };
}

const fishes = [];
for (const sp of species) for (let i = 0; i < sp.count; i++) fishes.push(createFish(sp));

// ---------- Food ----------
const foods = [];
const foodGeo = new THREE.SphereGeometry(0.06, 6, 5);
const foodMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; // ignore drags
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(water, false)[0] || raycaster.intersectObject(glass, false)[0];
  if (!hit) return;
  for (let i = 0; i < 8; i++) {
    const m = new THREE.Mesh(foodGeo, foodMat);
    m.position.set(
      THREE.MathUtils.clamp(hit.point.x + (Math.random() - 0.5) * 0.8, -W / 2 + 0.3, W / 2 - 0.3),
      H / 2 - 0.05,
      THREE.MathUtils.clamp(hit.point.z + (Math.random() - 0.5) * 0.8, -D / 2 + 0.3, D / 2 - 0.3)
    );
    scene.add(m);
    foods.push({ mesh: m, vy: -(0.2 + Math.random() * 0.2) });
  }
});

// ---------- Simulation ----------
const tmp = new THREE.Vector3(), steer = new THREE.Vector3(), sep = new THREE.Vector3();
const lookM = new THREE.Matrix4(), qTarget = new THREE.Quaternion(), UP = new THREE.Vector3(0, 1, 0);
const fishForward = new THREE.Quaternion().setFromAxisAngle(UP, Math.PI / 2); // model faces +X, lookAt uses -Z

function updateFish(f, dt, t) {
  steer.set(0, 0, 0);

  // Wander
  f.wander += dt * 0.6;
  steer.x += Math.sin(f.wander * 1.1 + f.phase) * 0.6;
  steer.y += Math.sin(f.wander * 0.7 + f.phase * 2) * 0.25;
  steer.z += Math.cos(f.wander * 0.9 + f.phase) * 0.6;

  // Separation from other fish + loose schooling with same species
  sep.set(0, 0, 0);
  const align = tmp.set(0, 0, 0);
  let n = 0;
  for (const o of fishes) {
    if (o === f) continue;
    const d = f.pos.distanceTo(o.pos);
    const minD = (f.species.scale + o.species.scale) * 1.6;
    if (d < minD && d > 0) sep.add(new THREE.Vector3().subVectors(f.pos, o.pos).multiplyScalar((minD - d) / d));
    if (o.species === f.species && d < 3) { align.add(o.vel); n++; }
  }
  steer.addScaledVector(sep, 3);
  if (n) steer.addScaledVector(align.divideScalar(n).normalize(), 0.5);

  // Food attraction
  let closest = null, cd = Infinity;
  for (const food of foods) {
    const d = f.pos.distanceTo(food.mesh.position);
    if (d < cd) { cd = d; closest = food; }
  }
  let speedBoost = 1;
  if (closest && cd < 9) {
    steer.add(new THREE.Vector3().subVectors(closest.mesh.position, f.pos).normalize().multiplyScalar(3));
    speedBoost = 1.8;
    if (cd < f.species.scale * 1.3) {
      scene.remove(closest.mesh);
      foods.splice(foods.indexOf(closest), 1);
    }
  }

  // Keep inside tank (soft walls)
  const lim = (v, half, axis) => {
    const m = f.margin;
    if (v > half - m - 0.8) steer[axis] -= (v - (half - m - 0.8)) * 4;
    if (v < -half + m + 0.8) steer[axis] += (-half + m + 0.8 - v) * 4;
  };
  lim(f.pos.x, HALF.x, 'x');
  lim(f.pos.z, HALF.z, 'z');
  lim(f.pos.y, HALF.y, 'y');
  const fy = floorY(f.pos.x, f.pos.z) + f.margin + 0.3;
  if (f.pos.y < fy) steer.y += (fy - f.pos.y) * 5;

  f.vel.addScaledVector(steer, dt);
  f.vel.y *= 0.96; // fish mostly swim horizontally
  const speed = f.baseSpeed * speedBoost;
  f.vel.setLength(THREE.MathUtils.lerp(f.vel.length(), speed, 0.05));
  f.pos.addScaledVector(f.vel, dt);
  // Hard clamp as a safety net
  f.pos.x = THREE.MathUtils.clamp(f.pos.x, -HALF.x + f.margin, HALF.x - f.margin);
  f.pos.y = THREE.MathUtils.clamp(f.pos.y, -HALF.y + f.margin, HALF.y - f.margin);
  f.pos.z = THREE.MathUtils.clamp(f.pos.z, -HALF.z + f.margin, HALF.z - f.margin);

  f.mesh.position.copy(f.pos);
  lookM.lookAt(f.pos, tmp.copy(f.pos).sub(f.vel), UP);
  qTarget.setFromRotationMatrix(lookM).multiply(fishForward);
  f.mesh.quaternion.slerp(qTarget, Math.min(1, dt * 4));

  const wag = t * (6 + speed * 5) + f.phase;
  f.tail.rotation.y = Math.sin(wag) * 0.5;
  f.mesh.children[0].rotation.y = Math.sin(wag) * 0.06;
  f.sideFins.forEach((s, i) => { s.rotation.y = Math.sin(wag * 0.7 + i * Math.PI) * 0.4; });
}

const dummy = new THREE.Object3D();
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  for (const f of fishes) updateFish(f, dt, t);

  // Food sinks to the sand, then dissolves after a while
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i];
    const p = fd.mesh.position;
    const fy = floorY(p.x, p.z) + 0.06;
    if (p.y > fy) { p.y += fd.vy * dt; p.x += Math.sin(t * 2 + i) * 0.002; }
    else { fd.life = (fd.life || 0) + dt; if (fd.life > 8) { scene.remove(fd.mesh); foods.splice(i, 1); } }
  }

  for (let i = 0; i < BUBBLES; i++) {
    const b = bubbleData[i];
    b.pos.y += b.speed * dt;
    if (b.pos.y > H / 2) { b.pos.set(b.emitter.x, -H / 2 + 0.2, b.emitter.z); }
    dummy.position.set(b.pos.x + Math.sin(t * 3 + b.phase) * 0.1, b.pos.y, b.pos.z + Math.cos(t * 2.5 + b.phase) * 0.1);
    dummy.scale.setScalar(b.size * (1 + (b.pos.y + H / 2) / H * 0.6));
    dummy.updateMatrix();
    bubbles.setMatrixAt(i, dummy.matrix);
  }
  bubbles.instanceMatrix.needsUpdate = true;

  const sp = surfGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = surfBase[i * 3], z = surfBase[i * 3 + 2];
    sp.setY(i, Math.sin(x * 1.2 + t * 1.5) * 0.04 + Math.cos(z * 1.6 + t * 1.2) * 0.03);
  }
  sp.needsUpdate = true;
  surfGeo.computeVertexNormals();

  for (const m of weeds) if (m.userData.shader) m.userData.shader.uniforms.uTime.value = t;
  tankLight.intensity = 22 + Math.sin(t * 0.8) * 4;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
