name: x-monitor

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xmonitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    # Lets an in-flight trade or notification finish on `docker compose stop/up`.
    stop_grace_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-xmonitor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xmonitor}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Health/API endpoint, reachable only from the host itself.
      - "127.0.0.1:${API_PORT:-8080}:8080"

  # Periodic pg_dump into ./backups (custom format, restore with scripts/restore.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-xmonitor}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-xmonitor}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/xmonitor_$$(date +%Y%m%d_%H%M%S).dump
          if pg_dump -Fc -f "$$file"; then echo "backup written: $$file"; else echo "backup FAILED"; rm -f "$$file"; fi
          find /backups -name 'xmonitor_*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ))
        done

volumes:
  pgdata:
  redisdata:
